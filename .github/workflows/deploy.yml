name: Build and Deploy to Azure Container Apps

on:
  push:
    branches: [ "main" ]
    paths:
      - "backend/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image to GHCR
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}-backend
          IMAGE_TAG: ${{ github.sha }}
          PUSH_IMAGE: "1"
        run: ./scripts/build_backend_image.sh

      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build & Deploy (Dockerfile in backend/)
        uses: azure/container-apps-deploy-action@v1
        with:
          appSourcePath: ${{ github.workspace }}/backend
          dockerfilePath: Dockerfile

          acrName: ${{ secrets.ACR_NAME }}
          acrUsername: ${{ secrets.ACR_USERNAME }}
          acrPassword: ${{ secrets.ACR_PASSWORD }}

          resourceGroup: ${{ secrets.RESOURCE_GROUP }}
          containerAppName: ${{ secrets.CONTAINER_APP_NAME }}
          containerAppEnvironment: ${{ secrets.CONTAINER_APP_ENV }}
          location: ${{ secrets.LOCATION }}

          imageToBuild: ${{ secrets.ACR_NAME }}.azurecr.io/${{ secrets.IMAGE_NAME }}:${{ github.sha }}

          ingress: external
          targetPort: 8000

          environmentVariables: >-
            DATABASE_URL='${{ secrets.DATABASE_URL }}' STORAGE_PROVIDER=azure AZURE_STORAGE_CONNECTION_STRING='${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}' STORAGE_BUCKET_NAME='${{ secrets.STORAGE_BUCKET_NAME }}' EMBEDDINGS_ENABLED=true VOLTSNIP_GATEWAY_SECRET='${{ secrets.VOLTSNIP_GATEWAY_SECRET }}'
