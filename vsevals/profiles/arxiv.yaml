preset: full
suite_path: suite_arxiv.yaml
models:
  - openai:gpt-5-nano
runtime:
  strict: true
  auto_apply_patch: true
  pytest_isolated_overlay: true
  provider_spacing_seconds: 1.0
  pytest_timeout_seconds: 420
  eval_log_level: INFO
  llm_runtime: openai_sdk
  scoring_match_mode: llm
  scoring_primary_endpoint: constraint_binary
  auto_constraints_from_legacy_oracle: true
  publication_mode: true
  publication_require_clean_git: false
  resume: false
