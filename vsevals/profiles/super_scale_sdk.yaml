preset: full
suite_path: suite_arxiv.yaml
models:
  - openai:gpt-5.2
  - anthropic:claude-sonnet-4-6
runtime:
  strict: true
  auto_apply_patch: true
  pytest_isolated_overlay: true
  provider_spacing_seconds: 1.25
  pytest_timeout_seconds: 420
  eval_log_level: INFO
  llm_runtime: native_sdk
  voltsnip_preflight: warn
  voltsnip_preflight_auto_sync: true
  scoring_match_mode: llm
  scoring_primary_endpoint: constraint_binary
  scoring_judge_model: openai:gpt-5-mini
  scoring_judge_max_tokens: 1000
  constraint_pass_threshold: 0.70
  auto_constraints_from_legacy_oracle: true
  publication_mode: true
  publication_require_clean_git: false
  resume: false
