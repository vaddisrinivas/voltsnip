[project]
name = "script30"
version = "0.1.0"
description = "Script30: 30 composition bugs for VoltSnip eval harness"
requires-python = ">=3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orgops", "net", "cache", "errors", "logops"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
