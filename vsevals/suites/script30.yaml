suite:
  version: "1.0"
  description: "Script30: 30 composition bugs across 5 categories. Each bug requires both a code/logic fix AND an org-specific API call (orgops.*) that cannot be guessed from training data."
  usecase_id: script30
  default_repo_root: ../usecases/script30
  pytest_docker_image: moltsnip-pytest-script30:latest

models:
  - claudecode:claude-haiku-4-5
  - claudecode:claude-sonnet-4-6
  - codex:gpt-5.2-codex
  - codex:gpt-5.3-codex
  - openai:gpt-5-nano
  - openai:gpt-5-mini
  - anthropic:claude-haiku-4-5
  - anthropic:claude-sonnet-4-6
  - mock:echo

variants:
  - id: P0
    mode: direct
    memory_enabled: false
    tools_enabled: false
    retrieval_mode: none
    instruction_mode: none
    context_surface: user
    max_tool_roundtrips: 1
    include_oracle: false
    purpose: "Raw baseline — no tools, no memory. Model uses only training data."

  - id: P1
    mode: direct
    memory_enabled: false
    tools_enabled: false
    retrieval_mode: none
    instruction_mode: explicit
    context_surface: user
    max_tool_roundtrips: 1
    include_oracle: false
    purpose: "Baseline + explicit oracle criteria stated in prompt."

  - id: P2
    mode: agent
    memory_enabled: false
    tools_enabled: true
    retrieval_mode: agent_decides
    instruction_mode: none
    context_surface: tools_only
    max_tool_roundtrips: 4
    include_oracle: false
    purpose: "Tools available, zero guidance — agent decides what to retrieve."

  - id: P3
    mode: agent
    memory_enabled: true
    tools_enabled: false
    retrieval_mode: injected
    instruction_mode: none
    context_surface: system
    max_tool_roundtrips: 4
    include_oracle: false
    purpose: "Pre-fetched snippets injected into system prompt, no tools."

  - id: P4
    mode: agent
    memory_enabled: false
    tools_enabled: true
    retrieval_mode: agent_decides
    instruction_mode: none
    context_surface: skills_md_no_keys
    max_tool_roundtrips: 4
    include_oracle: false
    purpose: "SKILL.md guide + tools, no key hints — model follows workflow."

  - id: P5
    mode: agent
    memory_enabled: false
    tools_enabled: true
    retrieval_mode: agent_decides
    instruction_mode: none
    context_surface: agents_md_no_keys
    max_tool_roundtrips: 4
    include_oracle: false
    purpose: "AGENTS.md guide + tools, no key hints — MUST search instruction."

  - id: P6
    mode: agent
    memory_enabled: false
    tools_enabled: true
    retrieval_mode: agent_decides
    instruction_mode: none
    context_surface: skills_agents_md_no_keys
    max_tool_roundtrips: 4
    include_oracle: false
    purpose: "Both guides + tools, no key hints — maximum context."

