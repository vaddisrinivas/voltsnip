tasks:
- task:
    id: BUG62
    name: fallback_context_loss_and_trace
    description: Fix execute_with_fallback to pass context to each fallback callable and annotate each activated fallback via orgops.tracing.annotate_span.
    category: error_contracts
    difficulty: hard
    target_file: errors/fallback_chain.py
    line_start: 34
    line_end: 63
    test_command: uv run pytest -q tests/unit/test_bug62.py -k bug_62
    user_prompt: |
      Apply only this task fix using configured target file and line range.
      Keep API and behavior stable except for this bug requirement.
      Keep changes minimal, deterministic, and production-safe.
    context_code: |-
      def execute_with_fallback(self) -> Any:
          """Try *primary_fn*, then each fallback in order.

          BUG_62: Fallbacks are invoked as ``fb()`` without passing
          *context*, so the downstream handler loses the request ID,
          headers, and deadline.  The correct call is ``fb(self.context)``.

          Additionally, each activated fallback must be annotated via
          ``orgops.tracing.annotate_span("fallback.activated", index)``
          where *index* is the 0-based position in the fallbacks list.
          Neither the context propagation nor the tracing annotation is
          present in the buggy implementation.
          """
          try:
              return self.primary_fn(self.context)
          except Exception:
              pass

          for _idx, fb in enumerate(self.fallbacks):
              try:
                  # BUG_62: context not passed — should be fb(self.context)
                  # BUG_62: missing orgops.tracing.annotate_span("fallback.activated", _idx)
                  return fb()
              except Exception:
                  continue

          raise RuntimeError(
              "All fallbacks exhausted: primary and "
              f"{len(self.fallbacks)} fallback(s) failed"
          )
    expected_output: Pass context dict to each fallback callable AND emit fallback.activated tracing span annotation.
  voltsnip:
    required_snippets:
    - voltsnip/script30/category/error_contracts/guiding_principle/v1
    - voltsnip/script30/hard/bug62/scenario_context/v1
    snippet_context_limit: 4
    snippet_context_max_chars: 8000
  oracle:
    hidden_requirements:
    - Pass self.context to each fallback callable instead of calling fb() with no arguments.
    - Call orgops.tracing.annotate_span("fallback.activated", index) for each activated fallback.
    - The index argument is the 0-based position of the fallback in the list.
    success_indicators:
      correctness:
      - Each fallback receives the context dict (request_id, headers, etc.)
      - orgops.tracing.annotate_span is called with "fallback.activated" and the 0-based index
      - The first successful fallback result is returned
      consistency: []
    failure_modes:
    - Model fixes only the context propagation but omits the tracing annotation.
    - Model adds logging instead of orgops.tracing.annotate_span.
    - Model passes index as a keyword argument instead of positional.
    - Model calls annotate_span only for the successful fallback instead of every activated one.
    evaluation_criteria:
    - Keep edits localized to configured target file
    - 'Guiding principle key: voltsnip/script30/category/error_contracts/guiding_principle/v1'
    constraints:
    - id: bug62_context_and_trace
      voltsnip_key: voltsnip/script30/hard/bug62/scenario_context/v1
      check: Context propagation to fallbacks AND tracing annotation via orgops.tracing.annotate_span.
      judge_prompt: Does the implementation both pass context to each fallback callable (fb(self.context) instead of fb()) AND call orgops.tracing.annotate_span("fallback.activated", index) for each activated fallback where index is 0-based?
      expected: true
      trap_baseline: 0.15
