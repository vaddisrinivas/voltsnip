tasks:
- task:
    id: BUG45
    name: tls_chain_range_and_compliance
    description: Fix validate_cert_chain so every adjacent pair in the certificate chain is validated.
    category: http_resilience
    difficulty: hard
    target_file: net/tls_validator.py
    line_start: 44
    line_end: 82
    test_command: uv run pytest -q tests/unit/test_bug45.py -k bug_45
    user_prompt: |
      Apply only this task fix using configured target file and line range.
      Keep API and behavior stable except for this bug requirement.
      Keep changes minimal, deterministic, and production-safe.
    context_code: |-
      def validate_cert_chain(chain: List[Certificate]) -> dict[str, Any]:
          """Validate a TLS certificate chain from leaf to root.

          Each cert[i].issuer must equal cert[i+1].subject to form a valid
          chain.  Returns a summary dict with validation results.

          BUG_45: the loop range is wrong — ``range(1, len(chain))`` skips
          the leaf-to-first-intermediate check.  Should be
          ``range(len(chain) - 1)`` so every adjacent pair is validated.
          """
          if not chain:
              return {"valid": False, "depth": 0, "error": "empty chain"}

          if len(chain) == 1:
              is_valid = _is_self_signed(chain[0])
              return {
                  "valid": is_valid,
                  "depth": 1,
                  "self_signed": True,
                  "error": None if is_valid else "single cert is not self-signed",
              }

          errors: list[str] = []
          # BUG_45: wrong range — skips chain[0].issuer vs chain[1].subject
          for i in range(1, len(chain)):
              expected = chain[i].issuer
              actual = chain[i + 1].subject if i + 1 < len(chain) else chain[i].subject
              if expected != actual:
                  errors.append(
                      f"break at {i}: issuer={expected!r} != subject={actual!r}"
                  )

          is_valid = len(errors) == 0
          return {
              "valid": is_valid,
              "depth": len(chain),
              "errors": errors,
              "root_self_signed": _is_self_signed(chain[-1]),
          }
    expected_output: Fix loop range from range(1, len(chain)) to range(len(chain) - 1) AND record tls.chain.validated compliance decision via orgops.compliance.record_decision.
