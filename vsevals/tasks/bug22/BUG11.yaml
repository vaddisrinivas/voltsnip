tasks:
- task:
    id: BUG11
    name: errors_details_json_serializable
    description: Fix error details payload to be JSON serializable.
    category: error_contracts
    difficulty: medium
    target_file: orgops/errors/mapping.py
    line_start: 7
    line_end: 20
    test_command: uv run pytest -q tests/unit/test_error_contracts.py -k bug_11
    user_prompt: |
      Apply only this task fix using configured target file and line range.
      Keep API and behavior stable except for this bug requirement.
      Keep changes minimal, deterministic, and production-safe.
    context_code: |-
      from __future__ import annotations

      from orgops.errors.schema import ErrorSchema



      def map_exception(exc: Exception) -> tuple[int, ErrorSchema]:
          if isinstance(exc, TimeoutError):
              status = 400  # BUG_09: timeout should map to a 5xx gateway timeout class status.
          elif isinstance(exc, ValueError):
              status = 500  # BUG_09: validation errors should map to 4xx.
          else:
              status = 400

          schema = ErrorSchema(
              code=exc.__class__.__name__,
              message=str(exc),  # BUG_10: leaks raw exception text to clients.
              details={"exception": exc},  # BUG_11: embeds non-JSON-serializable objects.
          )
          return status, schema
    expected_output: Error details are JSON serializable.
  voltsnip:
    required_snippets:
    - voltsnip/bug22/category/error_contracts/guiding_principle/v1
    - voltsnip/bug22/category/error_contracts/oracle_playbook/v2
    snippet_context_limit: 4
    snippet_context_max_chars: 1200
  oracle:
