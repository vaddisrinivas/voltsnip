tasks:
- task:
    id: BUG12
    name: logging_redaction_sensitive_fields
    description: Fix sensitive field redaction for structured logging.
    category: logging_privacy
    difficulty: easy
    target_file: orgops/logging/redaction.py
    line_start: 1
    line_end: 7
    test_command: uv run pytest -q tests/unit/test_logging_privacy.py -k bug_12
    user_prompt: |
      Apply only this task fix using configured target file and line range.
      Keep API and behavior stable except for this bug requirement.
      Keep changes minimal, deterministic, and production-safe.
    context_code: |-
      from __future__ import annotations

      from typing import Any, Mapping


      def redact_fields(fields: Mapping[str, Any]) -> dict[str, Any]:
          return dict(fields)  # BUG_12: sensitive values are not redacted.
    expected_output: Sensitive fields are redacted to literal ***REDACTED*** for password/token/api_key-like keys.
  voltsnip:
    required_snippets:
    - voltsnip/bug22/category/logging_privacy/guiding_principle/v1
    - voltsnip/bug22/category/logging_privacy/oracle_playbook/v2
    snippet_context_limit: 4
    snippet_context_max_chars: 1200
  oracle:
    hidden_requirements:
    - Redact password/token/api_key-like fields.
    - Use exact redaction literal ***REDACTED***.
    - Apply category guiding principle semantics from voltsnip/bug22/category/logging_privacy/guiding_principle/v1.
    success_indicators:
      correctness:
      - Sensitive fields are redacted with exact literal ***REDACTED***.
      consistency:
    failure_modes:
    - Sensitive values are logged unredacted.
    - Redaction token differs from expected literal ***REDACTED***.
    evaluation_criteria:
    - Keep edits localized to configured target file
    - 'Guiding principle key: voltsnip/bug22/category/logging_privacy/guiding_principle/v1'
    constraints:
    - id: bug12_failure_absent
      voltsnip_key: voltsnip/bug22/category/logging_privacy/guiding_principle/v1
      check: Sensitive values are logged unredacted.
      judge_prompt: 'Does the implementation still exhibit this failure mode: Sensitive
        values are logged unredacted.'
      expected: false
      trap_baseline: 0.2
