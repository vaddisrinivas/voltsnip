tasks:
- task:
    id: BUG02
    name: http_backoff_uses_jitter
    description: Fix sleep computation to apply configured jitter deterministically as a positive additive offset.
    category: http_resilience
    difficulty: easy
    target_file: orgops/http/retry_policy.py
    line_start: 8
    line_end: 23
    test_command: uv run pytest -q tests/unit/test_http_resilience.py -k bug_02
    user_prompt: |
      Apply only this task fix using configured target file and line range.
      Keep API and behavior stable except for this bug requirement.
      Keep changes minimal, deterministic, and production-safe.
      Do not add randomness; jitter must be deterministic for repeatable tests.
    context_code: |-
      @dataclass
      class RetryPolicy:
          max_attempts: int = standards.DEFAULT_MAX_RETRY_ATTEMPTS
          backoff_seconds: float = standards.DEFAULT_BACKOFF_SECONDS
          jitter_seconds: float = standards.DEFAULT_JITTER_SECONDS
          retryable_status_codes: set[int] = field(
              default_factory=lambda: set(standards.DEFAULT_RETRYABLE_STATUS_CODES)  # BUG_01: retries on non-retryable 4xx status codes.
          )
          retryable_methods: set[str] = field(
              default_factory=lambda: set(standards.DEFAULT_IDEMPOTENT_METHODS)
              | {"POST"}  # BUG_06: retries non-idempotent POST by default.
          )

          def compute_sleep(self, attempt: int) -> float:
              base = self.backoff_seconds * attempt  # BUG_03: linear, not exponential backoff.
              return base + self.jitter_seconds  # BUG_02: jitter configured but not applied.
    expected_output: Backoff output is deterministic and strictly greater than base when jitter_seconds > 0.
  voltsnip:
    required_snippets:
    - voltsnip/bug22/category/http_resilience/guiding_principle/v1
    - voltsnip/bug22/category/http_resilience/oracle_playbook/v2
    snippet_context_limit: 4
    snippet_context_max_chars: 1200
  oracle:
    hidden_requirements:
    - Use jitter_seconds in sleep computation.
    - Apply category guiding principle semantics from voltsnip/bug22/category/http_resilience/guiding_principle/v1.
    success_indicators:
      correctness:
      - Backoff output reflects jitter configuration.
      consistency: []
    failure_modes:
    - Jitter remains unused.
    evaluation_criteria:
    - Keep edits localized to configured target file
    - 'Guiding principle key: voltsnip/bug22/category/http_resilience/guiding_principle/v1'
    constraints:
    - id: deterministic_backoff
      voltsnip_key: voltsnip/bug22/category/http_resilience/guiding_principle/v1
      check: Backoff output reflects jitter configuration.
      judge_prompt: Is backoff deterministic and does it reflect the configured jitter value?
      trap_baseline: 0.24
