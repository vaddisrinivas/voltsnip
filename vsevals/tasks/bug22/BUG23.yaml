tasks:
- task:
    id: BUG23
    name: http_retry_on_timeout_exception
    description: Fix should_retry_exception to include TimeoutException as a retryable error.
    category: http_resilience
    difficulty: medium
    target_file: orgops/http/retry_policy.py
    line_start: 28
    line_end: 41
    test_command: uv run pytest -q tests/unit/test_http_resilience.py -k bug_23
    user_prompt: |
      Apply only this task fix using configured target file and line range.
      Keep API and behavior stable except for this bug requirement.
      Keep changes minimal, deterministic, and production-safe.
    context_code: |-
      def should_retry_exception(
          exc: BaseException,
          method: str,
          retryable_methods: set[str],
      ) -> bool:
          """Return True if *exc* warrants a retry attempt.

          BUG_23: only handles httpx.ConnectError; httpx.TimeoutException is not
          considered retryable and will propagate without retry.
          """
          import httpx  # local to avoid top-level circular import risk
          if method.upper() not in retryable_methods:
              return False
          return isinstance(exc, httpx.ConnectError)  # BUG_23: misses httpx.TimeoutException
    expected_output: TimeoutException on an idempotent method triggers a retry.
  voltsnip:
    required_snippets:
    - voltsnip/bug22/category/http_resilience/guiding_principle/v1
    - voltsnip/bug22/category/http_resilience/oracle_playbook/v2
    snippet_context_limit: 4
    snippet_context_max_chars: 1200
  oracle:
    hidden_requirements:
    - Treat httpx.TimeoutException as a retryable exception for idempotent methods.
    - Apply category guiding principle semantics from voltsnip/bug22/category/http_resilience/guiding_principle/v1.
    success_indicators:
      correctness:
      - TimeoutException on GET/HEAD/PUT is retried.
      consistency: []
    failure_modes:
    - TimeoutException propagates without retry.
    evaluation_criteria:
    - Keep edits localized to configured target file
    - 'Guiding principle key: voltsnip/bug22/category/http_resilience/guiding_principle/v1'
    constraints:
    - id: bug23_timeout_retried
      voltsnip_key: voltsnip/bug22/category/http_resilience/guiding_principle/v1
      check: TimeoutException on an idempotent method triggers retry.
      judge_prompt: Does the implementation retry on httpx.TimeoutException for idempotent methods?
      expected: true
      trap_baseline: 0.3
