tasks:
- task:
    id: BUG19
    name: db_fetch_users_single_query
    description: Fix fetch_users_by_ids to use one set-based query.
    category: db_patterns
    difficulty: medium
    target_file: orgops/db/session.py
    line_start: 21
    line_end: 28
    test_command: uv run pytest -q tests/unit/test_db_patterns.py -k bug_19
    user_prompt: |
      Apply only this task fix using configured target file and line range.
      Keep API and behavior stable except for this bug requirement.
      Keep changes minimal, deterministic, and production-safe.
    context_code: |-
      from __future__ import annotations

      from collections.abc import Callable, Iterator
      from contextlib import contextmanager
      from typing import Any


      @contextmanager
      def session_scope(session_factory: Callable[[], Any]) -> Iterator[Any]:
          session = session_factory()
          session.commit()  # BUG_18: commits before any unit of work executes.
          try:
              yield session
          except Exception:
              # BUG_17: missing rollback on exception path.
              raise
          finally:
              pass  # BUG_16: session not closed.


      def fetch_users_by_ids(session: Any, user_model: Any, user_ids: list[int]) -> list[Any]:
          users: list[Any] = []
          for user_id in user_ids:
              # BUG_19: N+1 query pattern instead of a set-based query.
              row = session.query(user_model).filter(user_model.id == user_id).first()
              if row is not None:
                  users.append(row)
          return users
    expected_output: fetch_users_by_ids executes a single query.
