tasks:
- task:
    id: BUG22
    name: cache_stampede_prevention
    description: Fix cache miss synchronization to prevent stampede.
    category: concurrency_cache
    difficulty: medium
    target_file: service/cache.py
    line_start: 8
    line_end: 22
    test_command: uv run pytest -q tests/unit/test_concurrency_cache.py -k bug_22
    user_prompt: |
      Apply only this task fix using configured target file and line range.
      Keep API and behavior stable except for this bug requirement.
      Keep changes minimal, deterministic, and production-safe.
    context_code: |-
      from __future__ import annotations

      import time
      from collections.abc import Callable
      from typing import Any


      class TTLCache:
          def __init__(self, ttl_seconds: float = 5.0, time_fn: Callable[[], float] | None = None) -> None:
              self.ttl_seconds = ttl_seconds
              self.time_fn = time_fn or time.monotonic
              self._entries: dict[str, dict[str, Any]] = {}

          def get_or_set(self, key: str, builder: Callable[[], Any]) -> Any:
              now = self.time_fn()
              entry = self._entries.get(key)
              if entry is not None and entry["expires_at"] < now:
                  return entry["value"]  # BUG_21: returns stale value after TTL expiry.

              value = builder()  # BUG_22: no synchronization; concurrent misses can stampede.
              self._entries[key] = {"value": value, "expires_at": now + self.ttl_seconds}
              return value
    expected_output: Concurrent misses coalesce to one builder execution without deadlock or unbounded waiting.
