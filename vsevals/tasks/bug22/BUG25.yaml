tasks:
- task:
    id: BUG25
    name: error_exception_cause_chain_preserved
    description: Fix wrap_exception to preserve the original cause chain via raise-from.
    category: error_contracts
    difficulty: medium
    target_file: orgops/errors/mapping.py
    line_start: 25
    line_end: 31
    test_command: uv run pytest -q tests/unit/test_error_contracts.py -k bug_25
    user_prompt: |
      Apply only this task fix using configured target file and line range.
      Keep API and behavior stable except for this bug requirement.
      Keep changes minimal, deterministic, and production-safe.
    context_code: |-
      def wrap_exception(exc: Exception, context: str) -> None:
          """Re-raise *exc* wrapped in a RuntimeError that includes *context*.

          Callers expect ``__cause__`` to be set so the original traceback is preserved.
          BUG_25: raises without ``from exc``; the original cause chain is silently dropped.
          """
          raise RuntimeError(f"{context}: {type(exc).__name__}")  # BUG_25: missing `from exc`
    expected_output: Wrapped exception has __cause__ set to the original exception.
  voltsnip:
    required_snippets:
    - voltsnip/bug22/category/error_contracts/guiding_principle/v1
    - voltsnip/bug22/category/error_contracts/oracle_playbook/v2
    snippet_context_limit: 4
    snippet_context_max_chars: 1200
  oracle:
    hidden_requirements:
    - Use 'raise X from exc' to preserve the exception cause chain.
    - Apply category guiding principle semantics from voltsnip/bug22/category/error_contracts/guiding_principle/v1.
    success_indicators:
      correctness:
      - wrapped.__cause__ is the original exception.
      consistency: []
    failure_modes:
    - Exception cause chain is dropped; __cause__ is None.
    evaluation_criteria:
    - Keep edits localized to configured target file
    - 'Guiding principle key: voltsnip/bug22/category/error_contracts/guiding_principle/v1'
    constraints:
    - id: bug25_cause_chain
      voltsnip_key: voltsnip/bug22/category/error_contracts/guiding_principle/v1
      check: Wrapped exception preserves __cause__.
      judge_prompt: Does the implementation use 'raise ... from exc' to set __cause__ on the wrapped exception?
      expected: true
      trap_baseline: 0.25
