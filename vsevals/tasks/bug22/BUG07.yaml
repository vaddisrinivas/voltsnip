      - Closed circuit allows request flow.
      consistency:
      - Implementation aligns with voltsnip/bug22/category/http_resilience/guiding_principle/v1 and voltsnip/bug22/task/bug07/guideline/v1.
    failure_modes:
    - Circuit open error raised for allowed request.
    evaluation_criteria:
    - Keep edits localized to configured target file
    - 'Guiding principle key: voltsnip/bug22/category/http_resilience/guiding_principle/v1'
    - 'Bug guideline key: voltsnip/bug22/task/bug07/guideline/v1'
    constraints:
    - id: bug07_primary_behavior
      voltsnip_key: voltsnip/bug22/task/bug07/guideline/v1
      check: Invert circuit gate logic correctly.
      judge_prompt: 'Does the implementation satisfy this requirement: Invert circuit
        gate logic correctly.'
      trap_baseline: 0.2
    - id: bug07_failure_absent
      voltsnip_key: voltsnip/bug22/category/http_resilience/guiding_principle/v1
