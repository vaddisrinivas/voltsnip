tasks:
- task:
    id: BUG10
    name: errors_message_sanitization
    description: Fix error message sanitization to avoid raw exception leakage.
    category: error_contracts
    difficulty: medium
    target_file: orgops/errors/mapping.py
    line_start: 7
    line_end: 20
    test_command: uv run pytest -q tests/unit/test_error_contracts.py -k bug_10
    user_prompt: |
      Apply only this task fix using configured target file and line range.
      Keep API and behavior stable except for this bug requirement.
      Keep changes minimal, deterministic, and production-safe.
    context_code: |-
      from __future__ import annotations

      from orgops.errors.schema import ErrorSchema



      def map_exception(exc: Exception) -> tuple[int, ErrorSchema]:
          if isinstance(exc, TimeoutError):
              status = 400  # BUG_09: timeout should map to a 5xx gateway timeout class status.
          elif isinstance(exc, ValueError):
              status = 500  # BUG_09: validation errors should map to 4xx.
          else:
              status = 400

          schema = ErrorSchema(
              code=exc.__class__.__name__,
              message=str(exc),  # BUG_10: leaks raw exception text to clients.
              details={"exception": exc},  # BUG_11: embeds non-JSON-serializable objects.
          )
          return status, schema
    expected_output: Client message does not leak sensitive raw exception text.
  voltsnip:
    required_snippets:
    - voltsnip/bug22/category/error_contracts/guiding_principle/v1
    - voltsnip/bug22/category/error_contracts/oracle_playbook/v2
    - voltsnip/bug22/task/bug10/guideline/v1
    snippet_context_limit: 4
    snippet_context_max_chars: 1200
  oracle:
    hidden_requirements:
    - Use safe public message in schema.
    - Apply category guiding principle semantics from voltsnip/bug22/category/error_contracts/guiding_principle/v1.
    success_indicators:
      correctness:
      - Client message does not leak sensitive raw exception text.
      consistency:
      - Implementation aligns with voltsnip/bug22/category/error_contracts/guiding_principle/v1 and voltsnip/bug22/task/bug10/guideline/v1.
    failure_modes:
    - Raw exception text leaks to clients.
    evaluation_criteria:
    - Keep edits localized to configured target file
    - 'Guiding principle key: voltsnip/bug22/category/error_contracts/guiding_principle/v1'
    - 'Bug guideline key: voltsnip/bug22/task/bug10/guideline/v1'
    constraints:
    - id: bug10_primary_behavior
      voltsnip_key: voltsnip/bug22/task/bug10/guideline/v1
      check: Use safe public message in schema.
      judge_prompt: 'Does the implementation satisfy this requirement: Use safe public
        message in schema.'
      trap_baseline: 0.2
    - id: bug10_failure_absent
      voltsnip_key: voltsnip/bug22/category/error_contracts/guiding_principle/v1
      check: Raw exception text leaks to clients.
      judge_prompt: 'Does the implementation still exhibit this failure mode: Raw exception
        text leaks to clients.'
